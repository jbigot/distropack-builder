# The uv workspace of distro-releases and distropack-builder; not a package itself.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "distro-releases",
    "distropack-builder",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-socket",
    "respx",
    "ruff",
    "shellcheck-py",
    "syrupy",
    "time-machine",
    "types-PyYAML",
    "types-docker",
    "zstandard",
]
docs = [
    "furo",
    "myst-parser",
    "sphinx",
    "sphinx-jsonschema",
    "sphinxcontrib-typer",
]

[tool.uv.sources]
distro-releases = { workspace = true }
distropack-builder = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
pythonpath = ["tests", "tests/golden"]
markers = [
    "e2e: builds the fixture project in containers (needs a rootful Docker engine)",
    "packaging: builds the packages from synthetic repositories and archives (needs git, uv and PyPI, for the build requirements and the wheels' dependencies)",
    "docker: runs containers (needs a container engine and docker.io/library/alpine)",
    "live: reads the real release sources of distro-releases (needs the network; nightly, non-blocking)",
]
addopts = "--import-mode=importlib -m 'not e2e and not packaging and not live and not docker' --disable-socket --allow-hosts=127.0.0.1"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tests", "tests/golden", "packages/*/src"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"packages/*/tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["packages/*/src", "tests"]
mypy_path = "tests:tests/golden"
explicit_package_bases = true  # tests/conftest.py and tests/workspace/conftest.py

# filetype and createrepo_c ship neither types nor a py.typed marker, and typeshed has no stubs
# for them.
[[tool.mypy.overrides]]
module = ["createrepo_c", "filetype"]
ignore_missing_imports = true

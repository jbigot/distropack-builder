# Builds the images, without publishing them: nothing is published from this repository before
# Phase 2, which brings publication back under ghcr.io/jbigot/distropack-builder/*.
name: Docker images
on:
  push:
    paths: &paths
    - packages/distro-releases/src/**
    - packages/distropack-builder/src/distropack_builder/images/**
    - build
    - .github/workflows/build.yml
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # A pull request from this repository is already covered by its push run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: { persist-credentials: false }
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with: { python-version: "3.13" }
    - name: Build the images
      shell: bash
      run: ./build | tee build.log
    - name: Check that every available image built
      # build exits 0 when an image fails: it prints SKIPPED instead of DONE. A release whose base
      # image its registry does not publish (yet) is UNAVAILABLE, by design, and not attempted.
      shell: bash
      run: |
        built=$(grep -c '===> docker build ' build.log || true)
        done=$(grep -c '===> DONE ' build.log || true)
        unavailable=$(grep -c '===> UNAVAILABLE ' build.log || true)
        echo "$built images built, $done done, $unavailable without a base image"
        if grep -q '===> SKIPPED ' build.log || [ "$built" -eq 0 ] || [ "$built" -ne "$done" ]; then
          echo "::error::an image failed to build: see SKIPPED in the log of the previous step"
          exit 1
        fi

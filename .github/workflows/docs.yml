# Builds the versioned documentation site, main and every distropack-builder release, and leaves
# it as the run's `site` artifact. Nothing is deployed: publishing it to GitHub Pages comes with
# the initial release, in Phase 10 of the modernization. CI's `docs` job checks the working tree of
# every push; this one checks that the versions build together.
name: Docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_LOCKED: 1
jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every version: the release tags and main.
      with: { persist-credentials: false, fetch-depth: 0 }
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - run: uv run --group docs sphinx-polyversion docs/poly.py "$RUNNER_TEMP/site"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: { name: site, path: "${{ runner.temp }}/site", retention-days: 14, if-no-files-found: error }

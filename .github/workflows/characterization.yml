name: Characterization
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTEST: uv run --no-project --python 3.13 --with-requirements tests/requirements.txt pytest
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: { persist-credentials: false }
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - run: $PYTEST
  golden:
    # master's pkgbuild needs a rootful engine (note 164): the runner's Docker is one
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: { persist-credentials: false }
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Record the golden master
      id: record
      if: hashFiles('tests/golden/__snapshots__/**') == ''
      run: $PYTEST -m golden --snapshot-update -rs
    - if: steps.record.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: golden-master
        path: tests/golden/__snapshots__
    - if: steps.record.outcome == 'success'
      run: |
        echo "::error::golden master recorded; commit the golden-master artifact"
        exit 1
    - run: $PYTEST -m "golden or e2e" -rs -v

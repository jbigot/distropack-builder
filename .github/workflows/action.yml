# Runs the two actions of this repository, `uses: ./plan` and `uses: ./`, on the fixture project of
# the end-to-end tests, as a workflow of another repository would, and checks their outputs.
name: Action
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_LOCKED: 1
  # The upstream tarballs of the fixture, served by each job that builds hello-lib.
  BASE_URL: http://127.0.0.1:8765
jobs:
  plan:
    # A pull request from this repository is already covered by its push run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: { persist-credentials: false }
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with: { version-file: .tool-versions }
    - run: >-
        uv run python tests/fixture_project.py "$RUNNER_TEMP/work" "$BASE_URL"
        --releases debian:trixie ubuntu:noble fedora:44 el:10 --packages hello-lib hello-app
    - id: plan
      uses: ./plan
      with: { working-directory: "${{ runner.temp }}/work", config: project/build.conf }
    - name: the matrix lists the four releases
      env: { MATRIX: "${{ steps.plan.outputs.matrix }}" }
      run: |
        expected='[{"distrib":"debian","release":"trixie","uid":"debian-13-trixie"},{"distrib":"el","release":"10","uid":"el-10"},{"distrib":"fedora","release":"44","uid":"fedora-44"},{"distrib":"ubuntu","release":"noble","uid":"ubuntu-24.04-noble"}]'
        [ "$(jq -cS . <<< "$MATRIX")" = "$(jq -cS . <<< "$expected")" ]
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - { release: "debian:trixie", distrib: debian, index: "dists/trixie/InRelease" }
        - { release: "fedora:44", distrib: fedora, index: "44/repodata/repomd.xml" }
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: { persist-credentials: false }
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with: { version-file: .tool-versions }
    # the images of this checkout, which the registry only has once main publishes them
    - run: uv run python tests/bake_fixture_images.py
    - env: { RELEASE: "${{ matrix.release }}" }
      run: |
        uv run python tests/fixture_project.py "$RUNNER_TEMP/work" "$BASE_URL" \
          --releases "$RELEASE" --packages hello-lib hello-app
        python3 -m http.server 8765 -d "$RUNNER_TEMP/work/served" > /dev/null 2>&1 &
    # hello-lib's deb tarball is uscan's, which the fixture's sources file cannot list
    - run: uv run distropack-build sources "$RUNNER_TEMP/work/project/build.conf" hello-lib
    - id: build
      uses: ./
      with:
        working-directory: ${{ runner.temp }}/work
        config: project/build.conf
        distributions: ${{ matrix.release }}
        # The fixture's, not a secret: the masked job checks that it shows nowhere.
        passphrase: test-passphrase
    - name: the outputs name the published repository
      env:
        FAILED: ${{ steps.build.outputs.failed }}
        OUTPUT_DIRS: ${{ steps.build.outputs.output-dirs }}
        DISTRIB: ${{ matrix.distrib }}
        INDEX: ${{ matrix.index }}
      run: |
        [ "$FAILED" = false ]
        [ "$(jq -r 'keys | join(" ")' <<< "$OUTPUT_DIRS")" = "$DISTRIB" ]
        dir=$(jq -r --arg d "$DISTRIB" '.[$d]' <<< "$OUTPUT_DIRS")
        [ "$dir" = "$RUNNER_TEMP/work/project/repositories/$DISTRIB" ]
        test -f "$dir/$INDEX"
  states:
    # fetch tells what changed against the states, no-publish builds, publish-only publishes
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: { persist-credentials: false }
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with: { version-file: .tool-versions }
    - run: uv run python tests/bake_fixture_images.py
    - run: |
        uv run python tests/fixture_project.py "$RUNNER_TEMP/work" "$BASE_URL" \
          --releases debian:trixie --packages hello-lib hello-app
        python3 -m http.server 8765 -d "$RUNNER_TEMP/work/served" > /dev/null 2>&1 &
    - run: uv run distropack-build sources "$RUNNER_TEMP/work/project/build.conf" hello-lib
    - id: first
      uses: ./
      with: &fetch
        working-directory: ${{ runner.temp }}/work
        config: project/build.conf
        mode: fetch
        state-dir: states
        download-dir: downloads
    - uses: ./
      with:
        working-directory: ${{ runner.temp }}/work
        config: project/build.conf
        mode: no-publish
        state-dir: states
        download-dir: downloads
        passphrase: test-passphrase
    - id: second
      uses: ./
      with: *fetch
    - uses: ./
      with:
        working-directory: ${{ runner.temp }}/work
        config: project/build.conf
        mode: publish-only
        state-dir: states
        passphrase: test-passphrase
    - name: changed before the build, not after; publish-only published the states
      env:
        FIRST: ${{ steps.first.outputs.changed }}
        SECOND: ${{ steps.second.outputs.changed }}
      run: |
        [ "$FIRST" = true ]
        [ "$SECOND" = false ]
        test -f "$RUNNER_TEMP/work/project/repositories/debian/dists/trixie/InRelease"
  failing:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: { persist-credentials: false }
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with: { version-file: .tool-versions }
    - run: uv run python tests/bake_fixture_images.py
    # hello-undeclared uses a tool its packaging does not declare: its build fails
    - run: >-
        uv run python tests/fixture_project.py "$RUNNER_TEMP/work" "$BASE_URL"
        --releases debian:trixie --packages hello-undeclared
    - id: build
      uses: ./
      continue-on-error: true
      with:
        working-directory: ${{ runner.temp }}/work
        config: project/build.conf
        passphrase: test-passphrase
    - name: the step failed and says so
      env:
        OUTCOME: ${{ steps.build.outcome }}
        FAILED: ${{ steps.build.outputs.failed }}
      run: |
        [ "$OUTCOME" = failure ]
        [ "$FAILED" = true ]
  notify:
    # dry-run: the request it would send, never sent
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: { persist-credentials: false }
    - id: notify
      uses: ./notify
      with:
        repository: pdidev/pkgs
        channel: nightly
        token: not-a-token
        packages: pdi pdiplugin-mpi
        dry-run: true
    - name: the request is the dispatch of this commit
      env:
        BODY: ${{ steps.notify.outputs.body }}
        REF: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
      run: |
        expected=$(jq -cn --arg ref "$REF" --arg sha "$SHA" '{event_type: "distropack-build",
          client_payload: {channel: "nightly", ref: $ref, commit: $sha, packages: ["pdi", "pdiplugin-mpi"]}}')
        [ "$(jq -cS . <<< "$BODY")" = "$(jq -cS . <<< "$expected")" ]
  masked:
    needs: build
    runs-on: ubuntu-24.04
    permissions: { actions: read }
    steps:
    - name: the passphrase shows only where GitHub prints the inputs, before the action masks it
      env:
        GH_TOKEN: ${{ github.token }}
        API: ${{ github.api_url }}/repos/${{ github.repository }}/actions
        RUN_ID: ${{ github.run_id }}
        ATTEMPT: ${{ github.run_attempt }}
      run: |
        ids=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
          "$API/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" |
          jq -r '.jobs[] | select(.name | startswith("build")) | .id')
        [ -n "$ids" ]
        for id in $ids; do
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$API/jobs/$id/logs" > log
          grep -q 'hello-app on' log
          # a timestamp, then a `name: value` line of an input or env listing
          if grep -F test-passphrase log | grep -Ev '^\S+ +[A-Za-z_-]+: test-passphrase$'; then
            echo "job $id shows the passphrase" >&2
            exit 1
          fi
        done

# The end-to-end tests on two releases of every family, every night: one packaging built for
# several releases of a family, which CI's run, one release each, does not cover. CI's docker job
# covers the engines (rootful and rootless Docker, rootless Podman) through the runner's tests.
name: Nightly e2e
on:
  schedule:
  - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_LOCKED: 1
  DISTROPACK_NIGHTLY: 1
jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: { persist-credentials: false }
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with: { version-file: .tool-versions }
    # the images of this checkout, for the widened releases
    - run: uv run --python 3.13 python tests/bake_fixture_images.py
    - run: uv run --python 3.13 pytest -m e2e -rs -v

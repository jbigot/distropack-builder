name: distropack-builder
description: >-
  Builds the deb and rpm packages of a project in containers, and publishes their signed apt and
  dnf repositories, as `distropack-build run` does.
branding: { icon: package, color: blue }
inputs:
  config:
    description: The build configuration, relative to `working-directory`.
    default: build.conf
  working-directory:
    description: The directory the builder runs from.
    default: .
  distributions:
    description: >-
      Only the releases these patterns name, separated by spaces or line breaks: a distribution
      (`debian`) or one of its releases (`debian:trixie`, `fedora:44`); all those of `config`
      when empty.
    default: ''
  jobs:
    description: >-
      How many builds run at once, and how many jobs each one runs (default: the number of
      processors, plus one).
    default: ''
  passphrase:
    description: The passphrase of the signing key; pass it from a secret.
    default: ''
  check-reproducible:
    description: >-
      `true` to build every package twice, varied, and fail the packages whose files differ.
    default: 'false'
  download-dir:
    description: >-
      Where to keep the downloaded sources from run to run (with `actions/cache`, say), relative
      to `working-directory`; a temporary directory when empty.
    default: ''
  verbose:
    description: >-
      `true` to print every build's output in its log group, not only the failed builds'.
    default: 'false'
  channel:
    description: The channel to build, or fetch for; the release channel of `config` when empty.
    default: ''
  state-dir:
    description: >-
      Where each release keeps the packages of its last complete build, relative to
      `working-directory` (with `actions/cache`, say); a temporary directory when empty.
    default: ''
  snapshots:
    description: >-
      The commits to build instead of the heads of their channel's refs, `<package>=<commit>`
      separated by spaces or line breaks; what a push event names.
    default: ''
  mode:
    description: >-
      `run` to build and publish; `no-publish` to build and keep the states only;
      `publish-only` to publish the states of `state-dir` and build nothing; `fetch` to resolve the
      channel's snapshots and download its sources into `download-dir`, for later steps, and,
      with `state-dir`, set `changed`.
    default: run
outputs:
  failed:
    description: >-
      `true` when the run did not succeed (a build or a publication failed, or an error stopped
      it), `false` otherwise; the step fails too, so read it with `continue-on-error`.
    value: ${{ steps.run.outputs.failed }}
  output-dirs:
    description: >-
      The JSON object of the repositories published, their absolute path by distribution id, for
      the distributions with a release selected: read it with `fromJSON`.
    value: ${{ steps.run.outputs.output-dirs }}
  changed:
    description: >-
      With `mode: fetch` and `state-dir`, `true` when a build would make anything the states do
      not hold (a release without a state, a new commit, a packaging change), `false` otherwise;
      empty in the other modes.
    value: ${{ steps.run.outputs.changed }}
runs:
  using: composite
  steps:
  # Before anything prints: GitHub masks only secrets by itself.
  - if: inputs.passphrase != ''
    shell: bash
    env: { PASSPHRASE: "${{ inputs.passphrase }}" }
    run: echo "::add-mask::$PASSPHRASE"
  # No cache: it would be keyed on the calling repository, and could poison a publishing workflow.
  # The uv this repository pins, not one the caller's files may require.
  - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    with: { enable-cache: false, version-file: "${{ github.action_path }}/.tool-versions" }
  - id: run
    shell: bash
    working-directory: ${{ inputs.working-directory }}
    env:
      CONFIG: ${{ inputs.config }}
      DISTRIBUTIONS: ${{ inputs.distributions }}
      JOBS: ${{ inputs.jobs }}
      VERBOSE: ${{ inputs.verbose }}
      DOWNLOAD_DIR: ${{ inputs.download-dir }}
      CHECK_REPRODUCIBLE: ${{ inputs.check-reproducible }}
      CHANNEL: ${{ inputs.channel }}
      STATE_DIR: ${{ inputs.state-dir }}
      SNAPSHOTS: ${{ inputs.snapshots }}
      MODE: ${{ inputs.mode }}
      DISTROPACK_GPG_PASSPHRASE: ${{ inputs.passphrase }}
    run: |
      . "$GITHUB_ACTION_PATH/action/patterns.sh"
      mode_command "$MODE"
      distribution_options "$DISTRIBUTIONS"
      snapshot_options "$SNAPSHOTS"
      if [ -n "$CHANNEL" ]; then options+=(--channel "$CHANNEL"); fi
      if [ -n "$STATE_DIR" ]; then options+=(--state-dir "$STATE_DIR"); fi
      if [ -n "$DOWNLOAD_DIR" ]; then
        options+=(--download-dir "$DOWNLOAD_DIR")
      elif [ "$MODE" = fetch ]; then
        echo "::error::mode: fetch needs the input download-dir, for the later steps to use"
        exit 1
      fi
      if [ "$MODE" != fetch ]; then
        if [ -n "$JOBS" ]; then options+=(-j "$JOBS"); fi
        if [ "$VERBOSE" = true ]; then options+=(--verbose); fi
        if [ "$CHECK_REPRODUCIBLE" = true ]; then options+=(--check-reproducible); fi
      fi
      "$GITHUB_ACTION_PATH/action/run-cli" "${command[@]}" "${options[@]}" "$CONFIG"

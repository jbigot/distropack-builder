[project]
name = "distropack-builder"
dynamic = ["version"]
description = "Build deb and rpm packages and their signed repositories in containers"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSES/MIT.txt"]
readme = "README.md"
authors = [{name = "Julien Bigot", email = "julien@julien-bigot.fr"}]
keywords = ["deb", "rpm", "packaging", "apt", "dnf", "repository", "docker", "podman"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
    "Typing :: Typed",
]
dependencies = [
    "createrepo-c",
    "cryptography",
    "distro-releases",
    "docker",
    "filetype",
    "httpx",
    "jinja2",
    "pydantic",
    "pysequoia",
    "python-debian",
    "pyyaml",
    "rich",
    "stamina",
    "typer",
]

[project.urls]
Homepage = "https://jbigot.github.io/distropack-builder/"
Documentation = "https://jbigot.github.io/distropack-builder/"
Source = "https://github.com/jbigot/distropack-builder"
Issues = "https://github.com/jbigot/distropack-builder/issues"

[project.scripts]
distropack-build = "distropack_builder.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = '^(?:distropack-builder-v)?(?P<version>\d.*)$'

[tool.hatch.version.raw-options]
search_parent_directories = true

[tool.hatch.version.raw-options.scm.git]
describe_command = "git describe --dirty --tags --long --match 'distropack-builder-v*'"

[tool.uv.sources]
distro-releases = { workspace = true }

.distribution: &distribution
    versions: [ supported ]
    repository: &repository
        name: pdidev
        description: "PDI dev packages"
    gpg:
        file: "key.gpg"
distribs:
    debian:
        <<: *distribution
        versions: [ bookworm, supported, testing, sid ]
        repository:
            <<: *repository
            path: "debian"
            url: "https://repo.pdi.dev/debian/"
    ubuntu:
        <<: *distribution
        repository:
            <<: *repository
            path: "ubuntu"
            url: "https://repo.pdi.dev/ubuntu/"
    fedora:
        <<: *distribution
        repository:
            <<: *repository
            path: "fedora"
            url: "https://repo.pdi.dev/fedora/"
packages:
    paraconf:
    pdi:
    pdidev-archive-keyring:
        disable: { fedora: all }
    pdiplugin-decl-hdf5:
    pdiplugin-decl-netcdf:
    pdiplugin-mpi:
    pdiplugin-pycall:
    pdiplugin-serialize:
    pdiplugin-set-value:
    pdiplugin-timer:
    pdiplugin-trace:
    pdiplugin-user-code:

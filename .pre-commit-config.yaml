# ruff and mypy run from uv.lock, so that the hooks, CI and the upgrade job use the same versions.
repos:
- repo: local
  hooks:
  - id: ruff-check
    name: ruff check
    entry: uv run --frozen ruff check --force-exclude
    language: system
    types_or: [python, pyi]
    require_serial: true
  - id: ruff-format
    name: ruff format
    entry: uv run --frozen ruff format --check --force-exclude
    language: system
    types_or: [python, pyi]
    require_serial: true
  - id: mypy
    name: mypy
    # Checks the files of [tool.mypy] as a whole: one module's change can break another.
    entry: uv run --frozen mypy
    language: system
    types_or: [python, pyi, toml]
    pass_filenames: false
    require_serial: true
  - id: mypy-distro-releases-tests
    name: mypy (distro-releases tests)
    # A run of their own: their conftest.py would clash with tests/conftest.py as module `conftest`.
    entry: uv run --frozen mypy packages/distro-releases/tests
    language: system
    types_or: [python, pyi, toml]
    pass_filenames: false
    require_serial: true
  - id: mypy-distropack-builder-tests
    name: mypy (distropack-builder tests)
    # A run of their own, for the same reason.
    entry: uv run --frozen mypy packages/distropack-builder/tests
    language: system
    types_or: [python, pyi, toml]
    pass_filenames: false
    require_serial: true
  - id: shellcheck
    name: shellcheck
    # Every shell file: the release scripts, the action's, the images' entrypoints, the tests'.
    entry: uv run --frozen shellcheck
    language: system
    types: [shell]
  # The uv of the environment, .tool-versions' in CI, not a second pin of uv in this file.
  - id: uv-lock
    name: uv-lock
    entry: uv lock --check
    language: system
    files: (^|/)(pyproject\.toml|uv\.lock)$
    pass_filenames: false
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.32.0
  hooks:
  - id: zizmor
- repo: https://github.com/fsfe/reuse-tool
  rev: v6.3.0
  hooks:
  - id: reuse
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0.39.0
  hooks:
  - id: check-dependabot

# ruff and mypy run from uv.lock, so that the hooks, CI and the upgrade job use the same versions.
repos:
- repo: local
  hooks:
  - id: ruff-check
    name: ruff check
    entry: uv run --frozen ruff check --force-exclude
    language: system
    types_or: [python, pyi]
    require_serial: true
  - id: ruff-format
    name: ruff format
    entry: uv run --frozen ruff format --check --force-exclude
    language: system
    types_or: [python, pyi]
    require_serial: true
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.13.7
  hooks:
  - id: uv-lock
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.32.0
  hooks:
  - id: zizmor
